all:
  children:
    postgresql_servers:
      hosts:
        postgresql_server:
          ansible_host: "{{ lookup('env', 'SERVER_HOST') }}"
          ansible_user: "{{ lookup('env', 'SERVER_USERNAME') }}"
          ansible_password: "{{ lookup('env', 'SERVER_PASSWORD') }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no' 