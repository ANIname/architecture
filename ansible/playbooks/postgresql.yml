---
- name: Install and configure PostgreSQL 17
  hosts: all
  become: yes
  
  tasks:
    - name: Add PostgreSQL GPG key
      apt_key:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        state: present

    - name: Add PostgreSQL repository
      apt_repository:
        repo: "deb http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"
        state: present
        filename: pgdg
        update_cache: yes

    - name: Install PostgreSQL 17
      apt:
        name: 
          - postgresql-17
          - postgresql-client-17
        state: present

    - name: Start PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Configure PostgreSQL for external connections
      lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
        state: present
      notify: restart postgresql

    - name: Configure PostgreSQL authentication
      lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 trust"
        state: present
      notify: restart postgresql

    - name: Create PostgreSQL user
      become_user: postgres
      postgresql_user:
        name: "{{ lookup('env', 'POSTGRESQL_USERNAME') }}"
        password: "{{ lookup('env', 'POSTGRESQL_PASSWORD') }}"
        login: yes
        state: present

    - name: Create PostgreSQL database
      become_user: postgres
      postgresql_db:
        name: "{{ lookup('env', 'POSTGRESQL_DATABASE') }}"
        owner: "{{ lookup('env', 'POSTGRESQL_USERNAME') }}"
        state: present

  handlers:
    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted 