---
- name: Install and configure PostgreSQL 17
  hosts: all
  become: yes
  vars:
    postgresql_version: "17"
    postgresql_port: 5432
    
  tasks:
    - name: Remove old PostgreSQL repository
      file:
        path: /etc/apt/sources.list.d/pgdg.list
        state: absent

    - name: Remove old PostgreSQL GPG key
      file:
        path: /usr/share/keyrings/postgresql-keyring.gpg
        state: absent

    - name: Add PostgreSQL GPG key
      apt_key:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        state: present

    - name: Add PostgreSQL repository
      apt_repository:
        repo: "deb http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"
        state: present
        filename: pgdg
        update_cache: yes

    - name: Install PostgreSQL 17
      apt:
        name: 
          - postgresql-{{ postgresql_version }}
          - postgresql-client-{{ postgresql_version }}
          - python3-psycopg2
        state: present

    - name: Start and enable PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Configure PostgreSQL for external connections
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
        state: present
      notify: restart postgresql

    - name: Configure PostgreSQL authentication
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 trust"
        state: present
      notify: restart postgresql

    - name: Create PostgreSQL data directory if it doesn't exist
      file:
        path: /var/lib/postgresql/{{ postgresql_version }}/main
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Create PostgreSQL user
      postgresql_user:
        name: "{{ lookup('env', 'POSTGRESQL_USERNAME') }}"
        password: "{{ lookup('env', 'POSTGRESQL_PASSWORD') }}"
        login: yes
        state: present
        db: postgres

    - name: Create PostgreSQL database
      postgresql_db:
        name: "{{ lookup('env', 'POSTGRESQL_DATABASE') }}"
        owner: "{{ lookup('env', 'POSTGRESQL_USERNAME') }}"
        state: present

  handlers:
    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted 