- name: Install required packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    update_cache: true

- name: Add NodeSource GPG key
  apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Add NodeSource repository for Node.js 22
  apt_repository:
    repo: "deb https://deb.nodesource.com/node_22.x {{ ansible_distribution_release }} main"
    state: present
    update_cache: true

- name: Install Node.js 22
  apt:
    name: nodejs
    update_cache: true

- name: Install npm (if not included with nodejs package)
  apt:
    name: npm
    update_cache: true

- name: Verify Node.js installation
  command: node --version
  register: node_version
  changed_when: false

- name: Verify npm installation
  command: npm --version
  register: npm_version
  changed_when: false

- name: Display Node.js version
  debug:
    msg: "Node.js version: {{ node_version.stdout }}"

- name: Display npm version
  debug:
    msg: "npm version: {{ npm_version.stdout }}"

- name: Install global npm packages (optional)
  npm:
    name: "{{ item }}"
    global: true
  loop:
    - pm2
    - nodemon
  when: install_global_packages | default(false)
