- name: Install required packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - wget
    update_cache: true

- name: Download Node.js 22.x setup script
  get_url:
    url: https://deb.nodesource.com/setup_22.x
    dest: /tmp/setup_nodejs.sh
    mode: '0755'

- name: Run Node.js 22.x setup script
  shell: /tmp/setup_nodejs.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js 22
  apt:
    name: nodejs
    update_cache: true

- name: Clean up setup script
  file:
    path: /tmp/setup_nodejs.sh
    state: absent

- name: Verify Node.js installation
  command: node --version
  register: node_version
  changed_when: false

- name: Verify npm installation
  command: npm --version
  register: npm_version
  changed_when: false

- name: Display Node.js version
  debug:
    msg: "Node.js version: {{ node_version.stdout }}"

- name: Display npm version
  debug:
    msg: "npm version: {{ npm_version.stdout }}"

- name: Install global npm packages (optional)
  npm:
    name: "{{ item }}"
    global: true
  loop:
    - pm2
    - nodemon
  when: install_global_packages | default(false)
