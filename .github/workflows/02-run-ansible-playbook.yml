name: Run Ansible Playbook

on:
  workflow_run:
    workflows: ["Check Ansible Installed"]
    types: [completed]
    branches: [prod]

jobs:
  run-ansible-playbook:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible Collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Create Hosts File
        run: |
          mkdir -p ansible/inventories/production
          echo "[db]" > ansible/inventories/production/hosts.ini
          echo "${{ secrets.SERVER_HOST }} ansible_user=${{ secrets.SERVER_USERNAME }} ansible_ssh_pass=${{ secrets.SERVER_PASSWORD }} ansible_python_interpreter=/usr/bin/python3" >> ansible/inventories/production/hosts.ini

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook playbooks/site.yml -i inventories/production/hosts.ini
        env:
          POSTGRESQL_DATABASE: ${{ secrets.POSTGRESQL_DATABASE }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_PORT: ${{ secrets.POSTGRESQL_PORT }}