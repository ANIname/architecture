name: Setup PostgreSQL 17

on:
  push:
    branches: [prod]

jobs:
  setup-postgresql:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup PostgreSQL 17
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Setting up PostgreSQL 17..."
            
            # Install PostgreSQL 17 if not installed
            if ! command -v psql &> /dev/null; then
              echo "📦 Installing PostgreSQL 17..."
              sudo apt update
              sudo apt install -y wget gnupg2 lsb-release
              wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
              echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
              sudo apt update
              sudo apt install -y postgresql-17 postgresql-contrib-17
            fi
            
            # Start PostgreSQL service
            sudo systemctl start postgresql
            sudo systemctl enable postgresql
            
            # Create user and database (ignore errors if they exist)
            sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRESQL_USERNAME }} WITH PASSWORD '${{ secrets.POSTGRESQL_PASSWORD }}' SUPERUSER;" 2>/dev/null || true
            sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRESQL_DATABASE }};" 2>/dev/null || true
            
            # Grant permissions
            sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRESQL_DATABASE }} TO ${{ secrets.POSTGRESQL_USERNAME }};"
            sudo -u postgres psql -c "ALTER USER ${{ secrets.POSTGRESQL_USERNAME }} CREATEDB;"
            
            # Configure PostgreSQL
            sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /etc/postgresql/17/main/postgresql.conf
            sudo sed -i "s/local   all             all                                     peer/local   all             all                                     md5/" /etc/postgresql/17/main/pg_hba.conf
            sudo sed -i "s/host    all             all             127.0.0.1\/32            md5/host    all             all             0.0.0.0\/0               md5/" /etc/postgresql/17/main/pg_hba.conf
            
            # Restart PostgreSQL
            sudo systemctl restart postgresql
            
            echo "✅ PostgreSQL 17 setup completed"

      - name: Test connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export PGPASSWORD="${{ secrets.POSTGRESQL_PASSWORD }}"
            psql -h localhost -U ${{ secrets.POSTGRESQL_USERNAME }} -d ${{ secrets.POSTGRESQL_DATABASE }} -c "SELECT version();"
            echo "✅ Connection test successful" 