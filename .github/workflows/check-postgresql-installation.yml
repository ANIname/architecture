name: Check and Setup PostgreSQL 17

on:
  push:
    branches: [prod]

jobs:
  check-postgresql:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      status: ${{ steps.get_status.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check PostgreSQL version
        id: check_version
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            if command -v psql &> /dev/null; then
              PG_VERSION=$(psql --version | grep -oP '\d+' | head -1)
              if [[ "$PG_VERSION" == "17" ]]; then
                echo "✅ PostgreSQL 17 is already installed"
                echo "up_to_date" > /tmp/pg_status.txt
              else
                echo "⚠️ PostgreSQL $PG_VERSION found, needs upgrade to version 17"
                echo "needs_upgrade" > /tmp/pg_status.txt
                echo "$PG_VERSION" > /tmp/pg_current_version.txt
              fi
            else
              echo "❌ PostgreSQL is not installed"
              echo "not_installed" > /tmp/pg_status.txt
            fi

      - name: Get status
        id: get_status
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cat /tmp/pg_status.txt" > pg_status.txt
          echo "status=$(cat pg_status.txt)" >> $GITHUB_OUTPUT

      - name: Install PostgreSQL 17 (if not installed)
        id: install_postgresql
        if: steps.get_status.outputs.status == 'not_installed'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "📦 Installing PostgreSQL 17..."
            sudo apt update
            sudo apt install -y wget gnupg2 lsb-release
            wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
            echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt update
            sudo apt install -y postgresql-17 postgresql-contrib-17
            
            # Start and enable service
            sudo systemctl start postgresql
            sudo systemctl enable postgresql
            
            # Create user and database
            sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRESQL_USERNAME }} WITH PASSWORD '${{ secrets.POSTGRESQL_PASSWORD }}' SUPERUSER;" 2>/dev/null || true
            sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRESQL_DATABASE }};" 2>/dev/null || true
            sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRESQL_DATABASE }} TO ${{ secrets.POSTGRESQL_USERNAME }};"
            
            # Verify user and database exist
            echo "Verifying user and database creation..."
            sudo -u postgres psql -c "\du" | grep ${{ secrets.POSTGRESQL_USERNAME }} || {
              echo "User not found, creating again..."
              sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRESQL_USERNAME }} WITH PASSWORD '${{ secrets.POSTGRESQL_PASSWORD }}' SUPERUSER;"
            }
            
            sudo -u postgres psql -l | grep ${{ secrets.POSTGRESQL_DATABASE }} || {
              echo "Database not found, creating again..."
              sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRESQL_DATABASE }};"
              sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRESQL_DATABASE }} TO ${{ secrets.POSTGRESQL_USERNAME }};"
            }
            
            # Configure authentication
            echo "local   all             postgres                                peer" | sudo tee /etc/postgresql/17/main/pg_hba.conf
            echo "local   all             all                                     md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            echo "host    all             all             127.0.0.1/32            md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            echo "host    all             all             ::1/128                 md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            echo "host    all             all             0.0.0.0/0               md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            
            sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /etc/postgresql/17/main/postgresql.conf
            sudo systemctl restart postgresql
            echo "✅ PostgreSQL 17 installation completed"

      - name: Upgrade PostgreSQL to version 17 (if needed)
        id: upgrade_postgresql
        if: steps.get_status.outputs.status == 'needs_upgrade'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🔄 Upgrading PostgreSQL to version 17..."
            
            # Backup current data
            sudo -u postgres pg_dumpall > /tmp/postgresql_backup_$(date +%Y%m%d_%H%M%S).sql
            
            # Remove old version
            sudo systemctl stop postgresql
            sudo apt remove --purge -y postgresql*
            sudo apt autoremove -y
            
            # Install PostgreSQL 17
            sudo apt update
            sudo apt install -y wget gnupg2 lsb-release
            wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
            echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt update
            sudo apt install -y postgresql-17 postgresql-contrib-17
            
            # Start service
            sudo systemctl start postgresql
            sudo systemctl enable postgresql
            
            # Restore data
            sudo -u postgres psql -f /tmp/postgresql_backup_*.sql
            
            # Recreate user if needed
            sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRESQL_USERNAME }} WITH PASSWORD '${{ secrets.POSTGRESQL_PASSWORD }}' SUPERUSER;" 2>/dev/null || true
            sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRESQL_DATABASE }};" 2>/dev/null || true
            sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRESQL_DATABASE }} TO ${{ secrets.POSTGRESQL_USERNAME }};"
            
            # Configure authentication
            echo "local   all             postgres                                peer" | sudo tee /etc/postgresql/17/main/pg_hba.conf
            echo "local   all             all                                     md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            echo "host    all             all             127.0.0.1/32            md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            echo "host    all             all             ::1/128                 md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            echo "host    all             all             0.0.0.0/0               md5" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
            
            sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /etc/postgresql/17/main/postgresql.conf
            sudo systemctl restart postgresql
            echo "✅ PostgreSQL upgrade to version 17 completed"

      - name: Test connection
        if: steps.get_status.outputs.status == 'up_to_date' || steps.get_status.outputs.status == 'not_installed' || steps.get_status.outputs.status == 'needs_upgrade'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Only test if PostgreSQL is actually installed
            if command -v psql &> /dev/null; then
              echo "🔍 Testing PostgreSQL connection..."
              
              # Check if PostgreSQL service is running
              if sudo systemctl is-active --quiet postgresql; then
                echo "✅ PostgreSQL service is running"
              else
                echo "❌ PostgreSQL service is not running"
                sudo systemctl status postgresql
                exit 1
              fi
              
              # Wait a moment for PostgreSQL to be fully ready
              sleep 3
              
              # Test connection with password
              export PGPASSWORD="${{ secrets.POSTGRESQL_PASSWORD }}"
              echo "Testing connection to database ${{ secrets.POSTGRESQL_DATABASE }} as user ${{ secrets.POSTGRESQL_USERNAME }}"
              
              # Try connection with explicit password
              if psql -h localhost -U ${{ secrets.POSTGRESQL_USERNAME }} -d ${{ secrets.POSTGRESQL_DATABASE }} -c "SELECT version();" 2>&1; then
                echo "✅ Connection test successful"
              else
                echo "❌ Connection failed, trying alternative methods..."
                
                # Try with postgres user first to check if user exists
                echo "Checking if user exists..."
                sudo -u postgres psql -c "\du" | grep ${{ secrets.POSTGRESQL_USERNAME }} || echo "User ${{ secrets.POSTGRESQL_USERNAME }} not found"
                
                # Try connecting as postgres user to test database
                echo "Checking if database exists..."
                sudo -u postgres psql -l | grep ${{ secrets.POSTGRESQL_DATABASE }} || echo "Database ${{ secrets.POSTGRESQL_DATABASE }} not found"
                
                # Try connecting as postgres user to postgres database
                echo "Testing connection as postgres user..."
                sudo -u postgres psql -d postgres -c "SELECT version();" || echo "Cannot connect as postgres user"
                
                # Show pg_hba.conf for debugging
                echo "Current pg_hba.conf:"
                sudo cat /etc/postgresql/17/main/pg_hba.conf
                
                # Try to create user and database again
                echo "Attempting to create user and database again..."
                sudo -u postgres psql -c "CREATE USER ${{ secrets.POSTGRESQL_USERNAME }} WITH PASSWORD '${{ secrets.POSTGRESQL_PASSWORD }}' SUPERUSER;" 2>/dev/null || true
                sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.POSTGRESQL_DATABASE }};" 2>/dev/null || true
                sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRESQL_DATABASE }} TO ${{ secrets.POSTGRESQL_USERNAME }};"
                
                # Try connection again
                if psql -h localhost -U ${{ secrets.POSTGRESQL_USERNAME }} -d ${{ secrets.POSTGRESQL_DATABASE }} -c "SELECT version();" 2>&1; then
                  echo "✅ Connection test successful after retry"
                else
                  echo "❌ Connection still failed"
                  exit 1
                fi
              fi
            else
              echo "❌ PostgreSQL is not installed, skipping connection test"
            fi 