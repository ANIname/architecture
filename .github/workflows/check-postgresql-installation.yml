name: Setup PostgreSQL 17

on:
  push:
    branches: [prod]

jobs:
  setup-postgresql:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup PostgreSQL 17
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Setting up PostgreSQL 17..."
            
            # Install PostgreSQL 17 if not installed
            if ! command -v psql &> /dev/null; then
              echo "📦 Installing PostgreSQL 17..."
              sudo apt update
              sudo apt install -y wget gnupg2 lsb-release
              wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
              echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
              sudo apt update
              sudo apt install -y postgresql-17 postgresql-contrib-17
            fi
            
            # Start PostgreSQL service
            sudo systemctl start postgresql
            sudo systemctl enable postgresql
            
            # Create database and user
            sudo -u postgres psql <<'PSQL_EOF'
              CREATE DATABASE ${{ secrets.POSTGRESQL_DATABASE }};
              CREATE USER ${{ secrets.POSTGRESQL_USERNAME }} WITH PASSWORD '${{ secrets.POSTGRESQL_PASSWORD }}' SUPERUSER;
              GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.POSTGRESQL_DATABASE }} TO ${{ secrets.POSTGRESQL_USERNAME }};
              ALTER USER ${{ secrets.POSTGRESQL_USERNAME }} CREATEDB;
            PSQL_EOF

            # Connect to database and set schema permissions
            sudo -u postgres psql -d ${{ secrets.POSTGRESQL_DATABASE }} <<'PSQL_EOF'
              GRANT ALL ON SCHEMA public TO ${{ secrets.POSTGRESQL_USERNAME }};
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ${{ secrets.POSTGRESQL_USERNAME }};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ${{ secrets.POSTGRESQL_USERNAME }};
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO ${{ secrets.POSTGRESQL_USERNAME }};
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ${{ secrets.POSTGRESQL_USERNAME }};
            PSQL_EOF
            
            # Configure PostgreSQL
            sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /etc/postgresql/17/main/postgresql.conf
            sudo sed -i "s/local   all             all                                     peer/local   all             all                                     md5/" /etc/postgresql/17/main/pg_hba.conf
            sudo sed -i "s/host    all             all             127.0.0.1\/32            md5/host    all             all             0.0.0.0\/0               md5/" /etc/postgresql/17/main/pg_hba.conf
            
            # Restart PostgreSQL
            sudo systemctl restart postgresql
            
            echo "✅ PostgreSQL 17 setup completed"

      - name: Test connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export PGPASSWORD="${{ secrets.POSTGRESQL_PASSWORD }}"
            if psql -h localhost -U ${{ secrets.POSTGRESQL_USERNAME }} -d ${{ secrets.POSTGRESQL_DATABASE }} -c "SELECT version();" > /dev/null 2>&1; then
              echo "✅ Connection test successful"
            else
              echo "❌ Connection test failed"
              exit 1
            fi 