name: PostgreSQL Setup

on:
  push:
    branches: [prod]

jobs:
  setup-postgresql:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Check PostgreSQL
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            if ! which psql > /dev/null; then
              wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
              apt update
              apt install -y postgresql-17
              systemctl start postgresql
              
              # Allow external connections
              sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /etc/postgresql/17/main/postgresql.conf
              echo "host all all 0.0.0.0/0 trust" >> /etc/postgresql/17/main/pg_hba.conf
              systemctl restart postgresql
            fi

      - name: Terraform Apply
        working-directory: terraform/postgresql
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="db_host=${{ secrets.SERVER_HOST }}" \
            -var="app_user=${{ secrets.POSTGRESQL_USERNAME }}" \
            -var="app_password=${{ secrets.POSTGRESQL_PASSWORD }}" \
            -var="app_db=${{ secrets.POSTGRESQL_DATABASE }}"
